<!DOCTYPE html>
<html lang="en-US">

<head>
    <title>Contact Us | Rafting Company</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Reach out to white water company for more inquiring, reservation or website feedback">
    <meta name="author" content="Emmanuel Aiah Yamba">
    <link rel="stylesheet" href="styles/rafting.css">

</head>

<body>
    <header>
        <img class="logo" src="images/logo1.png" alt="Rafting Company Logo">
        <nav class="navContainer">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>


    <main class="main_contact">
        <h1 class="page_info">Contact Us</h1>


        <section class="info_about_company">
            <div class="details_information">
                <h2>Company Information</h2>
                <p><strong>Address:</strong> 23 Benjamin Freetown, Sierra Leone</p>
                <p><strong>Phone:</strong> +23273 499 103</p>
                <p><strong>Email:</strong> info@wwrafting.com</p>
            </div>


            <iframe class="google_map"
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3946.0123!2d-13.2345!3d8.4845!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xf04c309fc5fb7ff%3A0x4052023a0dcc1468!2s23C%20Benjamin%20Ln%2C%20Freetown%2C%20Sierra%20Leone!5e0!3m2!1sen!2ssl!4v1700000000000"
              loading="lazy">
            </iframe>
        </section>


        <section class="employee-section">
            <h2>Meet Our Team</h2>

            <div class="employee-grid">
                <figure class="team_member_card">
                    <img src="images/ecode.png" alt="Photo of Mr. Ecode" class="card_image">
                    <figcaption class="employee_title"><strong>Emmanuel Yamba</strong><br> General
                        Manager</figcaption>
                </figure>

                <figure class="team_member_card">
                    <img src="images/jimissa.jpg" alt="Photo of Mr. Div" class="card_image">
                    <figcaption class="employee_title"><strong>Sahr Jimissa</strong><br>Lead River
                        Guide</figcaption>
                </figure>

                <figure class="team_member_card">
                    <img src="images/db1.jpg" alt="Photo of Mr. Data" class="card_image">
                    <figcaption class="employee_title"><strong>Isaiah
                            Yamba</strong><br>Reservations Coordinator</figcaption>
                </figure>
            </div>
        </section>


        <section class="form_container">
            <h2>Send Us a Message</h2>

            <form action="#" method="post" class="form_contact_info">

                <!-- User Name -->
                <div class="form_particle">
                    <label for="username" class="form-label">Name:</label>
                    <input type="text" id="username" name="username" class="input_area" required>
                </div>


                <div class="form_particle">
                    <label for="useremail" class="form-label">Email:</label>
                    <input type="email" id="useremail" name="useremail" class="input_area" required>
                </div>


                <fieldset class="fieldset_area">
                    <legend class="legend_area">Purpose of Message:</legend>

                    <div class="radio_btn">
                        <input type="radio" id="general" name="purpose" value="general" checked>
                        <label for="general">General Inquiry</label>
                    </div>

                    <div class="radio_btn">
                        <input type="radio" id="reserve" name="purpose" value="reserve">
                        <label for="reserve">Reservation Question</label>
                    </div>

                    <div class="radio_btn">
                        <input type="radio" id="suggest" name="purpose" value="suggest">
                        <label for="suggest">Website Suggestion</label>
                    </div>
                </fieldset>


                <div class="form_particle">
                    <label for="message" class="form-label">Message:</label>
                    <textarea id="message" name="message" rows="4" class="textarea"
                      required></textarea>
                </div>


                <div class="form-item checkbox-item">
                    <input type="checkbox" id="newsletter" name="newsletter" value="subscribe">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>


                <div class="form_particle">
                    <button type="submit" class="submit-btn">Send Message</button>
                </div>

            </form>
        </section>
    </main>


    <footer>
        <p>© 2026 Yamba White Water Rafting Company | Emmanuel Aiah Yamba</p>
        <nav class="social_media">

            <a href="https://www.facebook.com/"><img class="social_media_image"
                  src="images/facebook.png" alt="facebook"></a>

            <a href="https://www.linkedin.com/"><img src="images/linkedin1.jpg" alt="linkedin"></a>

            <a href="https://www.instagram.com/"><img src="images/instagram.jfif"
                  alt="instagram"></a>

        </nav>
    </footer>

</body>

</html>
