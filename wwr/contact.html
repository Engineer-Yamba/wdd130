<!DOCTYPE html>
<html lang="en-US">

<head>
    <title>Contact Us | Rafting Company</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Reach out to white water company for more inquiring, reservation or website feedback">
    <meta name="author" content="Emmanuel Aiah Yamba">
    <link rel="stylesheet" href="styles/rafting.css">

</head>

<body>
    <header>
        <img class="logo" src="images/logo1.png" alt="Rafting Company Logo">
        <nav class="navContainer">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main class="main_contact">
        <h1 class="contact">Contact Us</h1>

        <section class="company">
            <h2 class="company_title_info">Company Information</h2>
            <div class="info_container">
                <p><strong>Address: </strong> 23C Benjamin Lane Freetown sierra
                    Leone</p>
                <p><strong>Phone: </strong>+23273 568 278</p>
                <p><strong>Email: </strong>info@wwrafting.com</p>
            </div>
        </section>

        <section class="employee_details">
            <h2 class="company_title_info">Meet Our Team</h2>
            <div class="employee_grid">
                <figure class="emp_card">
                    <img src="images/ey.png" alt="Photo of Emmanuel yamba">
                    <figcaption class="emp_caption"><strong>Emmanuel Yamba</strong> -General Manager
                    </figcaption>
                </figure>

                <figure class="emp_card">
                    <img src="images/miss.png" alt="Photo of Mary Jalloh">
                    <figcaption class="emp_caption"><strong>Mary Jalloh</strong> -Lead River Guide
                    </figcaption>
                </figure>

                <figure class="emp_card">
                    <img src="images/jacob (1).png" alt="photo of Jacob Yamba">
                    <figcaption class="emp_caption"><strong>Emmanuel Yamba</strong> -Reservations
                        Coordination
                    </figcaption>

                </figure>

            </div>

        </section>

        <!--Contact area-->
        <section class="form_info">
            <h2>Send Us a Message</h2>
            <form action="#" class="contact_form">
                <div class="form_particle">
                    <label for="name" class="user_label">Name</label>
                    <input type="text" name="username" id="username" class="input_area" required>
                </div>

                <div class="form_particle">
                    <label for="email" class="user_label">Name</label>
                    <input type="text" name="useremail" id="useremail" class="input_area" required>
                </div>


                <fieldset class="fieldset_form">
                    <legend class="form_legend">Purpose of Message:</legend>

                    <div class="radio-bottom">
                        <input type="radio" id="general" name="purpose" value="general" checked>
                        <label for="general">General Inquiry</label>
                    </div>

                    <div class="radio-bottom">
                        <input type="radio" id="reservation" name="purpose" value="reservation"
                          checked>
                        <label for="reservation">Reservation Question</label>
                    </div>

                    <div class="radio-bottom">
                        <input type="radio" id="suggestion" name="purpose" value="suggestion"
                          checked>
                        <label for="general">Website Suggestion</label>
                    </div>

                </fieldset>

                <div class="form-particle">
                    <label for="message" class="user_input">Message:</label>
                    <textarea id="message" name="message" rows="4" class="textarea_message"
                      required></textarea>
                </div>

                <div class="form-particle checkbox-area">
                    <input type="checkbox" id="newsletter" name="newsletter" value="subscribe">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>

                <div class="form_particle">
                    <button type="submit" class="submit_Btn">Send Message</button>

                </div>
            </form>
        </section>

    </main>

    <footer>


        <p>© 2026 Yamba White Water Rafting Company | Emmanuel Aiah Yamba</p>
        <nav class="social_media">

            <a href="https://www.facebook.com/">
                <img class="social_media_image" src="images/facebook.png" alt="facebook"></a>

            <a href="https://www.linkedin.com/">
                <img src="images/linkedin1.jpg" alt="linkedin"></a>

            <a href="https://www.instagram.com/">
                <img src="images/instagram.jfif" alt="instagram"></a>

        </nav>
    </footer>

</body>

</html>
