<!DOCTYPE html>
<html lang="en">

<head>
    <title>Table practice</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="styles/table.css" rel="stylesheet">
</head>

<body>
    <table>
        <thead>
            <tr>
                <th>League</th>
                <th>Team</th>
                <th>Record</th>
                <th>Player count</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td rowspan="3">Southern</td>
                <td>Parana</td>
                <td>52-19</td>
                <td>23</td>
            </tr>
            <tr>
                <td>Catarina</td>
                <td>49-24</td>
                <td>10</td>
            </tr>

            <tr>
                <td>Lacerda</td>
                <td>92-70</td>
                <td>27</td>
            </tr>
            <td rowspan="2">Western</td>
            <td>Acre</td>
            <td>75-87</td>
            <td>20</td>

            <tr>
                <td>Rondonia</td>
                <td>10-7</td>
                <td>12</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="3">Total Players</td>
                <td>92</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
